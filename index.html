<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lumina-IMTVec</title>
<style>
:root{
  --bg:#f4f3ef;--panel:#ffffff;--ink:#1d1b18;--muted:#6d685f;--line:#e2ded5;--soft:#f0ede6;
  --accent:#d9480f;--accent-ink:#fff;--ok:#2f7d4a;--err:#b42318;
  --checker-a:#e9e6df;--checker-b:#f8f7f3;
  --radius:14px;--shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141312;--panel:#1d1c1a;--ink:#ecebe7;--muted:#9a958c;--line:#2e2c29;--soft:#262421;
  --accent:#ff6b2c;--accent-ink:#1a0d06;--ok:#5cc17f;--err:#ff7a6b;
  --checker-a:#232120;--checker-b:#2b2927;--shadow:none;
}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
button,input,select{font:inherit;color:inherit}
header{display:flex;align-items:center;gap:12px;padding:14px 24px;border-bottom:1px solid var(--line);background:var(--panel)}
.logo{width:28px;height:28px;border-radius:8px;background:conic-gradient(from 200deg,#d9480f,#f59f00,#2f9e44,#1c7ed6,#ae3ec9,#d9480f)}
header h1{font-size:17px;margin:0;letter-spacing:.2px}
header .sub{color:var(--muted);font-size:13px}
header .health{margin-left:auto;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}.dot.ok{background:var(--ok)}.dot.bad{background:var(--err)}

.app{display:grid;grid-template-columns:340px 1fr;gap:20px;padding:20px 24px;max-width:1600px;margin:0 auto}
@media (max-width:900px){.app{grid-template-columns:1fr;padding:16px}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.side{display:flex;flex-direction:column;gap:16px;align-self:start;position:sticky;top:16px;
  max-height:calc(100vh - 32px);overflow-y:auto;scrollbar-gutter:stable;padding-right:2px}
@media (max-width:900px){.side{max-height:none;overflow:visible}}
@media (max-width:900px){.side{position:static}}
.section{padding:16px}
.section h2{font-size:13px;font-weight:600;color:var(--muted);margin:0 0 10px;text-transform:uppercase;letter-spacing:.6px}

.drop{border:1.5px dashed var(--line);border-radius:12px;padding:18px;text-align:center;cursor:pointer;transition:.15s;background:var(--soft)}
.drop:hover,.drop.over{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--soft))}
.drop strong{display:block;margin-bottom:2px}
.drop small{color:var(--muted)}
.file{display:none;gap:12px;align-items:center;margin-top:12px}
.file.show{display:flex}
.file img{width:56px;height:56px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.file .meta{min-width:0;font-size:13px}
.file .meta b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file .meta span{color:var(--muted)}

.presets{display:grid;gap:8px}
.preset{display:flex;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;transition:.12s}
.preset:hover{border-color:color-mix(in srgb,var(--accent) 50%,var(--line))}
.preset input{accent-color:var(--accent);margin-top:3px}
.preset.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 7%,transparent)}
.preset b{display:block;font-size:14px}
.preset span{font-size:12.5px;color:var(--muted)}
.hint{font-size:12px;color:var(--muted);margin-top:6px}

.gobar{position:sticky;bottom:0;z-index:2;margin-top:-4px;padding:12px 0 2px;
  background:linear-gradient(to bottom,transparent,var(--bg) 14px);text-align:center}
@media (max-width:900px){.gobar{position:sticky;bottom:0;padding-bottom:12px}}
.go{width:100%;padding:12px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:15px;cursor:pointer;transition:.12s}
.go:hover{filter:brightness(1.05)}.go:disabled{opacity:.45;cursor:not-allowed}

.main{display:flex;flex-direction:column;gap:16px;min-width:0}
.viewer{position:relative;height:min(72vh,820px);min-height:380px;overflow:hidden;border-radius:var(--radius);
  background:repeating-conic-gradient(var(--checker-a) 0 25%,var(--checker-b) 0 50%) 0 0/20px 20px;touch-action:none;cursor:grab}
.viewer.drag{cursor:grabbing}
.stage{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.stage img{position:absolute;left:0;top:0;width:100%;height:100%;user-select:none;-webkit-user-drag:none;pointer-events:none}
.empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);text-align:center;padding:24px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.split{position:absolute;top:0;bottom:0;width:0;border-left:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.25);cursor:ew-resize;display:none}
.split::after{content:"⇆";position:absolute;top:50%;left:-17px;width:32px;height:32px;margin-top:-16px;border-radius:50%;
  background:#fff;color:#222;display:grid;place-items:center;font-size:14px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.split::before{content:"";position:absolute;top:0;bottom:0;left:-12px;width:22px}
.lbl{position:absolute;top:10px;font-size:12px;padding:3px 8px;border-radius:6px;background:rgba(0,0,0,.55);color:#fff;pointer-events:none;display:none}
.lbl.l{left:10px}.lbl.r{right:10px}
.toolbar{position:absolute;right:10px;bottom:10px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.toolbar button{border:0;background:rgba(20,20,20,.7);color:#fff;padding:6px 10px;border-radius:8px;cursor:pointer;font-size:12.5px;backdrop-filter:blur(6px)}
.toolbar button.on{background:var(--accent);color:var(--accent-ink)}
.zoom{position:absolute;left:10px;bottom:10px;font-size:12px;padding:3px 8px;border-radius:6px;background:rgba(0,0,0,.55);color:#fff}

.progress{position:absolute;inset:0;display:none;place-items:center;background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(2px)}
.progress.show{display:grid}
.pbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 22px;min-width:280px;box-shadow:var(--shadow)}
.pbox b{display:block;margin-bottom:8px}
.bar{height:6px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .4s}
.bar.indet i{width:35%;animation:indet 1.2s ease-in-out infinite}
@keyframes indet{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}
.pbox small{display:block;margin-top:8px;color:var(--muted)}

.result{display:none;padding:14px 16px;align-items:center;gap:16px;flex-wrap:wrap}
.result.show{display:flex}
.stats{display:flex;gap:18px;flex-wrap:wrap;flex:1}
.stat small{display:block;font-size:11.5px;color:var(--muted)}
.stat b{font-size:15px;font-variant-numeric:tabular-nums}
.dl{display:flex;gap:8px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:9px;border:1px solid var(--line);text-decoration:none;color:var(--ink);font-size:14px;background:var(--panel)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.err{color:var(--err);padding:12px 16px;display:none}.err.show{display:block}

.history{padding:12px 16px}
.history h2{font-size:13px;color:var(--muted);margin:0 0 10px;font-weight:600}
.hlist{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.hitem{flex:0 0 auto;width:92px;cursor:pointer;font-size:11.5px;color:var(--muted);text-align:center}
.hitem img{width:92px;height:92px;object-fit:cover;border-radius:8px;border:1px solid var(--line);display:block;margin-bottom:4px;background:var(--soft)}
.hitem.cur img{outline:2px solid var(--accent);outline-offset:1px}
.hitem span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hitem{position:relative}
.hitem .ph{width:92px;height:92px;border-radius:8px;border:1px dashed var(--line);display:grid;place-items:center;margin-bottom:4px;background:var(--soft);font-size:12px}
.hitem .badge{position:absolute;left:4px;top:4px;font-size:10.5px;padding:1px 5px;border-radius:5px;background:var(--err);color:#fff}
.hitem .badge.q{background:var(--muted)}
.hitem .acts{position:absolute;right:4px;top:4px;display:none;gap:4px}
.hitem:hover .acts,.hitem:focus-within .acts{display:flex}
@media (hover:none){.hitem .acts{display:flex}}
.hitem .acts button{border:0;border-radius:6px;padding:2px 6px;font-size:11px;cursor:pointer;background:rgba(20,20,20,.72);color:#fff}
.hitem .acts button.warn{background:var(--err)}
.history h2{display:flex;justify-content:space-between;align-items:center}
.history h2 small{font-weight:400}
</style>
</head>
<body>
<header>
  <div class="logo"></div>
  <div><h1>Lumina-IMTVec <span id="ver" style="font-size:12px;font-weight:400;color:var(--muted)"></span></h1><div class="sub">面向 Lumina 3D 叠色打印的平面双层矢量转换引擎</div></div>
  <div class="health"><i class="dot" id="hdot"></i><span id="htext">检查服务…</span></div>
</header>

<div class="app">
  <aside class="side">
    <div class="panel section">
      <h2>图片</h2>
      <div class="drop" id="drop">
        <strong>拖入图片，或点击选择</strong>
        <small>也可以直接 Ctrl+V 粘贴 · PNG / JPG / WebP · 最大 40 MP</small>
      </div>
      <input type="file" id="file" accept="image/png,image/jpeg,image/webp" hidden>
      <div class="file" id="fileinfo"><img id="thumb" alt=""><div class="meta"><b id="fname"></b><span id="fmeta"></span></div></div>
    </div>

    <div class="panel section">
      <h2 id="modeTitle">转换模式</h2>
      <div class="presets" id="presets" role="radiogroup" aria-labelledby="modeTitle">
        <label class="preset sel"><input type="radio" name="preset" value="print-regions" checked>
          <div><b>双层矢量（矢量场 CNN）</b><span>启用 LineVectorNet 矢量场直出 Cubic Bezier 线稿层与无溢色边界约束着色层（支持透明底）</span></div>
        </label>
      </div>
      <div id="printRegionsOpts" style="display:flex;flex-direction:column;gap:8px;margin-top:10px">
        <label id="featureRoutingWrap" style="display:flex;align-items:flex-start;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;font-size:12.5px;cursor:pointer">
          <input type="checkbox" id="featureRouting" checked style="margin-top:2px">
          <span><b>CNN 智能特征路由（默认开启）</b><br><small id="cnnHint" style="color:var(--muted)">自动分割头发、面部五官、花朵发饰与渐变域，按主体分别约束色块并保护细节</small></span>
        </label>
        <label id="colorMergeWrap" style="display:flex;align-items:flex-start;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;font-size:12.5px;cursor:pointer">
          <input type="checkbox" id="colorMerge" checked style="margin-top:2px">
          <span><b>智能色彩合并与去毛边（可选）</b><br><small style="color:var(--muted)">按语义主体面积/线长比例自动合并近色色块、均色融合细发丝并清理边缘毛边；关闭则保留全量原始分区色彩</small></span>
        </label>
        <label id="smoothLinesWrap" style="display:flex;align-items:flex-start;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;font-size:12.5px;cursor:pointer">
          <input type="checkbox" id="smoothLines" checked style="margin-top:2px">
          <span><b>抑制线条锯齿（平滑锐化）</b><br><small style="color:var(--muted)">将折线与毛刺拟合为平滑短线/曲线，画面更干净</small></span>
        </label>
        <label id="srScaleWrap" style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;font-size:12.5px">
          <span><b>整图预处理放大倍率</b><br><small style="color:var(--muted)">放大后执行 95% 去杂色 + 平滑锐化 + CNN 识别</small></span>
          <select id="srScale" style="padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);font-size:12.5px">
            <option value="2" selected>2× (默认)</option>
            <option value="5">5× (高密线条)</option>
            <option value="10">10× (超密线条)</option>
          </select>
        </label>
      </div>
    </div>

    <div class="gobar"><button class="go" id="go" disabled>开始转换</button>
      <div class="hint">Ctrl+Enter</div></div>
  </aside>

  <section class="main">
    <div class="panel viewer" id="viewer">
      <div class="stage" id="stage"><img id="imgA" alt=""><img id="imgB" alt=""></div>
      <div class="split" id="split"></div>
      <span class="lbl l" id="lblL">原图</span><span class="lbl r" id="lblR">SVG</span>
      <div class="empty" id="empty"><div><b>还没有图片</b>选择一张插画开始；转换后可以拖动中线对比、滚轮放大检查线条</div></div>
      <span class="zoom" id="zoomLbl" hidden>100%</span>
      <div class="toolbar" id="toolbar" hidden>
        <button data-mode="compare" class="on">对比</button>
        <button data-mode="a">原图</button>
        <button data-mode="b">SVG</button>
        <button data-z="fit">适应</button>
        <button data-z="1">1:1</button>
        <button data-z="4">4×</button>
        <span id="layerBtns" hidden style="display:inline-flex;gap:4px;border-left:1px solid var(--line);padding-left:6px;margin-left:2px">
          <button data-layer="" class="on">双层</button>
          <button data-layer="line">仅线稿</button>
          <button data-layer="fill">仅着色</button>
          <button data-layer="heatmap">热力图</button>
        </span>
        <button id="svgBtn" hidden title="路径很多：默认显示栅格预览。点这里强制渲染真正的 SVG（几十万路径时可能几分钟无响应）">加载 SVG</button>
      </div>
      <div class="progress" id="progress"><div class="pbox">
        <b id="pTitle">上传中</b><div class="bar" id="pbar"><i id="pfill"></i></div><small id="pText"></small>
      </div></div>
    </div>

    <div class="panel err" id="err"></div>

    <div class="panel result" id="result">
      <div class="stats" id="stats"></div>
      <div class="dl"><a class="btn primary" id="dlSvg" download>下载 SVG</a><a class="btn" id="dlPng" download>PNG 预览</a></div>
    </div>

    <div class="panel history" id="history" hidden><h2>最近转换 <small id="hcount"></small></h2><div class="hlist" id="hlist"></div>
      <button class="btn" id="hmore" hidden style="margin-top:10px">加载更多</button></div>
  </section>
</div>

<script>
const $ = s => document.querySelector(s);
const PRESET_LABELS = {
  'print-regions': '纯色色区', 'source-detail': '完整绘制', auto: '自动',
  shading: 'Shading', 'shading-detail': 'Shading Detail', cel: 'Cel 平涂',
  illustration: 'Illustration', detail: 'Detail', flat: 'Flat',
};
const STRUCTURE_LABELS = {
  'print-regions': '纯色色区', regions: '纯色区块', fidelity: '保真描摹',
  flat: '分层·纯路径', structured: '分层·引用', lumina: 'Lumina 精确描摹',
};
const MODE_OPTIONS = {
  'print-regions': {structure: 'print-regions', bands: '84', gradient_mode: 'clean'},
};
let file = null, job = null, poll = null, srcURL = null;

$('#presets').onchange = () => {
  document.querySelectorAll('.preset').forEach(label => {
    label.classList.toggle('sel', label.querySelector('input').checked);
  });
  const pr = $('#presets input:checked').value === 'print-regions';
  $('#printRegionsOpts').style.display = pr ? 'flex' : 'none';
};

// ---------- file input: click, drop, paste
const drop = $('#drop');
drop.onclick = () => $('#file').click();
$('#file').onchange = e => e.target.files[0] && setFile(e.target.files[0]);
['dragenter','dragover'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave','drop'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => { const f = e.dataTransfer.files[0]; f && setFile(f); });
window.addEventListener('paste', e => { const it = [...e.clipboardData.items].find(i => i.type.startsWith('image/'));
  if (it) setFile(new File([it.getAsFile()], 'pasted.png', {type: it.type})); });

function setFile(f) {
  if (!/^image\/(png|jpeg|webp)$/.test(f.type)) return showErr('只支持 PNG / JPG / WebP');
  file = f; if (srcURL) URL.revokeObjectURL(srcURL); srcURL = URL.createObjectURL(f);
  const im = new Image(); im.onload = () => {
    $('#fname').textContent = f.name;
    $('#fmeta').textContent = `${im.naturalWidth}×${im.naturalHeight} · ${(im.naturalWidth*im.naturalHeight/1e6).toFixed(1)} MP · ${fmtBytes(f.size)}`;
    $('#thumb').src = srcURL; $('#fileinfo').classList.add('show'); $('#go').disabled = false;
    showErr(''); $('#result').classList.remove('show');
    setView(srcURL, null, im.naturalWidth, im.naturalHeight);
  }; im.src = srcURL;
}

// ---------- submit & poll
$('#go').onclick = () => {
  if (!file) return;
  const preset = $('#presets input:checked').value;
  const fd = new FormData();
  fd.append('image', file);
  fd.append('preset', preset);
  for (const [key, value] of Object.entries(MODE_OPTIONS[preset])) fd.append(key, value);
  if (preset === 'print-regions') {
    fd.append('smooth_lines', $('#smoothLines').checked ? '1' : '0');
    fd.append('feature_routing', $('#featureRouting').checked ? '1' : '0');
    fd.append('color_merge', $('#colorMerge').checked ? '1' : '0');
    fd.append('sr_scale', $('#srScale').value || '2');
  }
  $('#go').disabled = true; showErr(''); $('#result').classList.remove('show');
  progress(true, '上传中', 0, '');
  const x = new XMLHttpRequest(); x.open('POST', '/api/process');
  x.upload.onprogress = e => e.lengthComputable && progress(true, '上传中', e.loaded / e.total * 100, fmtBytes(e.loaded) + ' / ' + fmtBytes(e.total));
  x.onload = () => {
    let r = {}; try { r = JSON.parse(x.responseText); } catch {}
    if (x.status >= 400) { progress(false); $('#go').disabled = false; return showErr(r.error || '上传失败'); }
    job = r.job; track(job, true); loadHistory();
  };
  x.onerror = () => { progress(false); $('#go').disabled = false; showErr('连接失败'); };
  x.send(fd);
};

// sidebar fits the window (its own scrollbar) so the start button at its bottom is always visible
const side = $('.side');
function fitSide() { if (matchMedia('(max-width:900px)').matches) { side.style.maxHeight = ''; return; }
  side.style.maxHeight = (innerHeight - Math.max(side.getBoundingClientRect().top, 16) - 16) + 'px'; }
addEventListener('scroll', fitSide, {passive: true}); addEventListener('resize', fitSide); fitSide();
document.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key === 'Enter' && !$('#go').disabled) $('#go').click(); });

function track(id, fresh) {
  clearInterval(poll);
  const est = estimateSeconds();
  const tick = async () => {
    let r; try { r = await fetch('/api/status/' + id).then(r => r.json()); } catch { return; }
    if (r.status === 'queued') progress(true, '排队中', null, r.ahead ? `前面还有 ${r.ahead} 个任务` : '即将开始');
    else if (r.status === 'running') {
      const pct = r.progress != null ? r.progress * 100 : (est ? Math.min(95, r.elapsed / est * 100) : null);
      let eta = '';
      if (r.progress > 0.08) { const left = r.elapsed / r.progress - r.elapsed; eta = ` · 预计还需约 ${Math.max(1, Math.round(left))} 秒`; }
      progress(true, r.stage || '转换中', pct, `${pct != null ? Math.round(pct) + '% · ' : ''}已用 ${r.elapsed.toFixed(0)} 秒${eta}`);
    } else if (r.status === 'done') {
      clearInterval(poll); progress(false); $('#go').disabled = !file;
      if (fresh) learn(r);
      showResult(id, r); loadHistory();
    } else if (r.status === 'error' || r.error) {
      clearInterval(poll); progress(false); $('#go').disabled = !file; showErr('转换失败：' + (r.error || '未知错误')); loadHistory();
    }
  };
  tick(); poll = setInterval(tick, 1000);
}

// rough ETA learned from previous runs on this browser (seconds per megapixel)
function estimateSeconds() {
  let spm = null; try { spm = +localStorage.getItem('lvec.spm') || null; } catch {}
  const mp = (viewW * viewH) / 1e6; return spm && mp ? spm * mp : null;
}
function learn(r) { try { const mp = r.width * r.height / 1e6; if (mp && r.seconds) {
  const old = +localStorage.getItem('lvec.spm') || 0, v = r.seconds / mp;
  localStorage.setItem('lvec.spm', old ? old * .6 + v * .4 : v); } } catch {} }

const HEAVY_PATHS = 60000, HEAVY_BYTES = 20e6;   // Bezier 路径渲染轻量，仅超大密图回退栅格预览
let curResult = null, curHeavy = false, curHeavySvg = false, curLayer = '';
function showResult(id, r, forceSvg, layer = '') {
  curResult = [id, r];
  curLayer = layer || '';
  const hasLayers = (r.line_paths || 0) > 0 && (r.fill_paths || 0) > 0;
  const hasHeatmap = !!(r.heatmap || r.vector_field || r.status === 'done');
  $('#layerBtns').hidden = !(hasLayers || hasHeatmap);
  if (hasLayers || hasHeatmap) {
    $('#layerBtns').querySelectorAll('[data-layer]').forEach(b => {
      const l = b.dataset.layer;
      if (l === 'line' || l === 'fill') b.hidden = !hasLayers;
      else if (l === 'heatmap') b.hidden = !hasHeatmap;
      else b.hidden = false;
      b.classList.toggle('on', l === curLayer);
    });
  }
  const overBudget = !curLayer && ((r.paths || 0) > HEAVY_PATHS || (r.bytes || 0) > HEAVY_BYTES);
  curHeavy = overBudget;
  const src = srcURL || '/file/' + id + '.source';
  const hmUrl = r.heatmap || ('/file/' + id + '.heatmap.png');
  const svgUrl = curLayer === 'heatmap' ? hmUrl : (curLayer ? `${r.svg}?layer=${curLayer}` : r.svg);
  let bSrc = null, label = '';
  if (curLayer === 'heatmap') { bSrc = hmUrl; label = '热力图 (LineVectorNet)'; }
  else if (!overBudget || forceSvg || curLayer) { bSrc = svgUrl; label = curLayer === 'line' ? '线稿层 SVG' : curLayer === 'fill' ? '着色层 SVG' : 'SVG'; }
  else if (r.png) { bSrc = r.png; label = r.png_kind === 'raster' ? '栅格预览' : 'PNG 预览'; }
  curHeavySvg = !!bSrc && bSrc === svgUrl && overBudget && curLayer !== 'heatmap';     // 只在强制预览超大 SVG 时限制缩放
  if (bSrc) {
    setView(src, bSrc, r.width, r.height);
    $('#lblR').textContent = label;
    if (overBudget && !forceSvg) showErr('');
    // 强制查看超大 SVG 时关掉对比拖动：每拖一格都要重栅格化整张 SVG（实测 53 万路径 0.4~1.2 秒/帧）
    if (curHeavySvg) { setMode('b', true); showErr('超大 SVG 已切到“只看结果”，放大上限 200%。对比拖动会让浏览器每帧重绘整张 SVG，所以已禁用。'); }
  } else {                                                  // 没有预览图：绝不把超大 SVG 塞进 <img>
    setView(src, null, r.width, r.height);
    $('#lblR').textContent = '';
    showErr('结果 SVG ' + fmtBytes(r.bytes) + ' / ' + ((r.paths || 0).toLocaleString()) +
      ' 个路径：浏览器直接渲染会卡死，现在只显示原图。需要看矢量请点上方“加载 SVG”（可能长时间无响应），或直接下载。');
  }
  $('#svgBtn').hidden = !overBudget;
  const p = r.params || {};
  const stats = [
    ['预设', (PRESET_LABELS[r.preset] || r.preset) + (r.request?.preset === 'auto' ? ' (自动)' : '')],
    ['颗粒度', r.grain], ['尺寸', `${r.width}×${r.height}`],
    ['颜色', r.colors], ['总路径', (r.paths || 0).toLocaleString()],
    ['SVG', fmtBytes(r.bytes)], ['耗时', r.seconds + ' 秒'],
  ];
  if (hasLayers) {
    stats.splice(5, 0, ['线稿路径', r.line_paths.toLocaleString()], ['着色分区', r.fill_paths.toLocaleString()]);
  }
  if (p.ink && p.bands) stats.splice(4, 0, ['线条', p.lines === null ? '颜色规则' : (p.print_mm || p.line_style === 'contour' ? 'AI（旧）' : p.line_style === 'lens7' ? '发丝连续（实验）' : p.line_style === 'lens' ? 'AI 双曲线' : 'AI v3')]);
  if (p.structure === 'print-regions') {
    stats.splice(2, 0,
      ['CNN 路由', p.feature_routing !== false ? (r.vector_field ? 'LineVectorNet 矢量场' : 'ONNX 热力路由') : '已关闭'],
      ['色彩合并', p.color_merge !== false ? '已开启' : '已关闭'],
    );
  }
  if (p.structure) stats.splice(1, 0, ['结构', STRUCTURE_LABELS[p.structure] || p.structure]);
  if (p.hair_repair) stats.splice(2, 0, ['重建细线', (r.repaired_hairs ?? 0) + ' 条']);
  if (p.fine) stats.splice(1, 0, ['模式', '精细']);
  if (p.print_mm) stats.splice(1, 0, ['打印', `${p.print_mm} mm · 线宽 ${p.line_mm}`]);
  $('#stats').innerHTML = stats.map(([k, v]) => `<div class="stat"><small>${k}</small><b>${v ?? '–'}</b></div>`).join('');
  $('#dlSvg').href = r.svg + '?download=1';
  $('#dlPng').hidden = !r.png; if (r.png) $('#dlPng').href = r.png + '?download=1';
  $('#result').classList.add('show');
  document.querySelectorAll('.hitem').forEach(h => h.classList.toggle('cur', h.dataset.id === id));
}

const ST = {queued: ['排队', 'q'], running: ['转换中', 'q'], error: ['失败', ''], interrupted: ['中断', '']};
const PAGE = 20;
let hShown = 0, hTotal = 0;
function hItem(i) {
  const st = ST[i.status], busy = i.status === 'queued' || i.status === 'running';
  const thumb = i.thumb ? `<img loading="lazy" decoding="async" width="92" height="92" src="${i.thumb}" alt="">` : `<div class="ph">${st ? st[0] : ''}</div>`;
  const acts = busy ? '' : `<div class="acts">${(i.status !== 'done' && i.retry) ? '<button data-act="retry" title="用原来的设置重新转换">重试</button>' : ''}<button data-act="del" title="删除记录和文件">删除</button></div>`;
  const sub = i.status === 'done' ? `${i.preset || ''}${i.seconds ? ' · ' + i.seconds + 's' : ''}` : esc(i.error || (st ? st[0] : ''));
  return `<div class="hitem${i.id===job?' cur':''}" data-id="${i.id}" data-status="${i.status}" title="${esc(i.name||'')}${i.error ? '\n' + esc(i.error) : ''}">
    ${st ? `<i class="badge ${st[1]}">${st[0]}</i>` : ''}${acts}${thumb}<span>${esc(i.name || '')}</span><span>${sub}</span></div>`;
}
async function loadHistory(more) {
  const offset = more ? hShown : 0, limit = more ? PAGE : Math.max(PAGE, hShown);
  let r = {items: [], total: 0};
  try { r = await fetch(`/api/jobs?limit=${limit}&offset=${offset}`).then(r => r.json()); } catch {}
  hTotal = r.total || 0; hShown = offset + (r.items || []).length;
  $('#history').hidden = !hTotal;
  $('#hcount').textContent = hTotal ? `共 ${hTotal} 条 · 显示 ${hShown} 条 · 保存在服务器 /data` : '';
  const html = (r.items || []).map(hItem).join('');
  if (more) $('#hlist').insertAdjacentHTML('beforeend', html); else $('#hlist').innerHTML = html;
  $('#hmore').hidden = hShown >= hTotal;
}
$('#hmore').onclick = () => loadHistory(true);
$('#hlist').onclick = async e => {
  const h = e.target.closest('.hitem'); if (!h) return;
  const id = h.dataset.id, act = e.target.closest('button')?.dataset.act;
  if (act === 'del') {
    const b = e.target.closest('button');
    if (!b.classList.contains('warn')) {           // first click arms, second click deletes
      b.classList.add('warn'); b.textContent = '确认删除';
      setTimeout(() => { b.classList.remove('warn'); b.textContent = '删除'; }, 3000); return;
    }
    const r = await fetch('/api/jobs/' + id, {method: 'DELETE'});
    if (!r.ok) return showErr((await r.json().catch(() => ({}))).error || '删除失败');
    if (id === job) { job = null; $('#result').classList.remove('show'); }
    return loadHistory();
  }
  if (act === 'retry') {
    const r = await fetch(`/api/jobs/${id}/retry`, {method: 'POST'}); const j = await r.json().catch(() => ({}));
    if (!r.ok) return showErr(j.error || '重试失败');
    job = id; srcURL = null; showErr(''); $('#go').disabled = true; track(id, true); return loadHistory();
  }
  const r = await fetch('/api/status/' + id).then(r => r.json());
  if (r.status === 'done') { job = id; srcURL = null; showErr(''); showResult(job, r); }
  else if (r.status === 'queued' || r.status === 'running') { job = id; track(id, false); }
  else showErr(`${h.title.split('\n')[0]}：${r.error || '没有结果'}`);
};

// ---------- viewer: compare slider + zoom / pan
const viewer = $('#viewer'), stage = $('#stage'), A = $('#imgA'), B = $('#imgB'), split = $('#split');
let viewW = 0, viewH = 0, s = 1, tx = 0, ty = 0, cut = .5, mode = 'compare', hasB = false;

function setView(a, b, w, h) {
  viewW = w; viewH = h; A.src = a; hasB = !!b; if (b) B.src = b; else B.removeAttribute('src');
  $('#empty').hidden = true; $('#toolbar').hidden = false; $('#zoomLbl').hidden = false;
  if (!hasB) setMode('a', true); else setMode(mode === 'a' ? 'compare' : mode, true);
  fit();
}
function fit() { const r = viewer.getBoundingClientRect(); s = Math.min(r.width / viewW, r.height / viewH) * .96;
  tx = (r.width - viewW * s) / 2; ty = (r.height - viewH * s) / 2; apply(); }
function zoomAt(ns, cx, cy) { ns = Math.max(.05, Math.min(curHeavySvg ? 2 : 12, ns)); tx = cx - (cx - tx) * ns / s; ty = cy - (cy - ty) * ns / s; s = ns; apply(); }
function apply() {
  // resize layout (not CSS scale) so the SVG is re-rasterised crisply at every zoom level
  stage.style.transform = `translate(${tx}px,${ty}px)`;
  stage.style.width = viewW * s + 'px'; stage.style.height = viewH * s + 'px';
  const showB = hasB && mode !== 'a', showA = mode !== 'b' || !hasB;
  A.style.visibility = showA ? 'visible' : 'hidden'; B.style.visibility = showB ? 'visible' : 'hidden';
  B.style.clipPath = mode === 'compare' ? `inset(0 0 0 ${cut * 100}%)` : 'none';
  const cmp = hasB && mode === 'compare';
  split.style.display = cmp ? 'block' : 'none'; split.style.left = (tx + viewW * s * cut) + 'px';
  $('#lblL').style.display = $('#lblR').style.display = cmp ? 'block' : 'none';
  $('#zoomLbl').textContent = Math.round(s * 100) + '%';
}
function setMode(m, quiet) { mode = m; $('#toolbar').querySelectorAll('[data-mode]').forEach(b => {
  b.classList.toggle('on', b.dataset.mode === m); b.style.display = (!hasB && b.dataset.mode !== 'a') ? 'none' : ''; });
  if (!quiet) apply(); }
$('#toolbar').onclick = e => { const b = e.target.closest('button'); if (!b) return;
  if (b.id === 'svgBtn') { if (curResult) showResult(curResult[0], curResult[1], true, curLayer); return; }
  if (b.dataset.layer !== undefined) { if (curResult) showResult(curResult[0], curResult[1], true, b.dataset.layer); return; }
  if (b.dataset.mode) return setMode(b.dataset.mode), apply();
  const r = viewer.getBoundingClientRect();
  if (b.dataset.z === 'fit') fit(); else zoomAt(+b.dataset.z, r.width / 2, r.height / 2); };
viewer.addEventListener('wheel', e => { if (!viewW) return; e.preventDefault(); const r = viewer.getBoundingClientRect();
  zoomAt(s * Math.exp(-e.deltaY * .0015), e.clientX - r.left, e.clientY - r.top); }, {passive: false});
let dragging = null, last = null;
viewer.addEventListener('pointerdown', e => { if (!viewW || e.target.closest('.toolbar')) return;
  dragging = e.target === split ? 'split' : 'pan'; last = [e.clientX, e.clientY];
  viewer.setPointerCapture(e.pointerId); if (dragging === 'pan') viewer.classList.add('drag'); });
viewer.addEventListener('pointermove', e => { if (!dragging) return; const r = viewer.getBoundingClientRect();
  if (dragging === 'split') cut = Math.max(0, Math.min(1, (e.clientX - r.left - tx) / (viewW * s)));
  else { tx += e.clientX - last[0]; ty += e.clientY - last[1]; last = [e.clientX, e.clientY]; }
  apply(); });
['pointerup','pointercancel'].forEach(t => viewer.addEventListener(t, () => { dragging = null; viewer.classList.remove('drag'); }));
viewer.addEventListener('dblclick', e => { if (!viewW) return; const r = viewer.getBoundingClientRect();
  zoomAt(s < 1 ? 1 : s * 2, e.clientX - r.left, e.clientY - r.top); });
window.addEventListener('resize', () => viewW && fit());

// ---------- helpers
function progress(show, title, pct, text) {
  $('#progress').classList.toggle('show', show); if (!show) return;
  $('#pTitle').textContent = title; $('#pText').textContent = text || '';
  $('#pbar').classList.toggle('indet', pct == null); $('#pfill').style.width = pct == null ? '' : pct + '%';
}
function showErr(m) { $('#err').textContent = m; $('#err').classList.toggle('show', !!m); }
function fmtBytes(b) { return b == null ? '–' : b > 1048576 ? (b / 1048576).toFixed(2) + ' MB' : (b / 1024).toFixed(0) + ' KB'; }
function esc(t) { return t.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

fetch('/healthz').then(r => r.json()).then(h => {
  $('#hdot').className = 'dot ' + (h.weights ? 'ok' : 'bad');
  if (h.cnn_ready) {
    $('#htext').textContent = '服务正常 · ' + (h.vector_ready ? 'LineVectorNet 矢量场已加载' : 'CNN 已加载') + (h.directml ? ' (DirectML)' : ' (CPU)');
  } else {
    $('#htext').textContent = h.weights ? '服务正常（未检测到 CNN ONNX 权重）' : '缺少模型权重';
    if ($('#cnnHint')) $('#cnnHint').textContent = '未检测到 weights/*.onnx，将自动回退至传统规则路由';
  }
  if (h.version) $('#ver').textContent = 'v' + h.version;
}).catch(() => { $('#hdot').className = 'dot bad'; $('#htext').textContent = '服务不可用'; });
loadHistory();
</script>
</body>
